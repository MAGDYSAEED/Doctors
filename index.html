<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>مواعيد الدكاترة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#0f1b2d;--mut:#667085;--line:#e4e7ec;--pri:#0f1b2d;--on:#0f9d58;--amb:#d97706;--hd:#0f1b2d;--off:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--ink:#eef2f7;--mut:#94a3b8;--line:#223049;--pri:#3b82f6;--on:#34d399;--amb:#fbbf24;--hd:#131c2e;--off:#f87171}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;max-width:620px;margin-inline:auto;padding:12px 14px 100px}
button{font:inherit;color:inherit}
.top{background:var(--hd);color:#fff;border-radius:22px;padding:18px 18px 14px;border:1px solid var(--line)}
.r1{display:flex;justify-content:space-between;align-items:flex-start}
.clk{font-size:46px;font-weight:700;line-height:1;direction:ltr;font-variant-numeric:tabular-nums}
.clk small{font-size:17px;font-weight:500;opacity:.7;margin-inline-start:6px}
.dt{opacity:.75;margin-top:6px;font-size:15px}
.ic{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.sum{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
.sum div+div{border-inline-start:1px solid rgba(255,255,255,.15);padding-inline-start:14px}
.sum b{display:block;font-size:26px;line-height:1.1}.sum span{font-size:13px;opacity:.75}
.srch{width:100%;margin:14px 0 4px;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.areas{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.chip.sel{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.chip.add{border-style:dashed;color:var(--mut)}
.cd{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.cd.on{border-color:var(--on)}
.ck{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:transparent;color:#fff;font-size:19px;cursor:pointer}
.met .ck{background:var(--amb);border-color:var(--amb)}
.bd{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:700;font-size:17px}
.sp{margin-inline-start:8px;font-size:12px;font-weight:500;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:1px 8px}
.pl{color:var(--mut);font-size:14px;margin-top:3px}
.stt{margin-top:8px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px;color:var(--mut)}
.stt i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.on .stt{color:var(--on)}.on .stt i{background:var(--on);animation:pl 1.8s infinite}
.later .stt{color:var(--amb)}.later .stt i{background:var(--amb)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(15,157,88,.5)}70%{box-shadow:0 0 0 8px rgba(15,157,88,0)}100%{box-shadow:0 0 0 0 rgba(15,157,88,0)}}
.dys{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.dy{font-style:normal;font-size:12px;padding:3px 8px;border-radius:8px;background:var(--bg);color:var(--mut)}
.dy.a{background:var(--pri);color:#fff}
.mt{font-size:14px;margin-top:8px;font-weight:500}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.b{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block;color:var(--ink)}
.b.p{background:var(--pri);border-color:var(--pri);color:#fff}
.b.del{color:var(--off);margin-inline-start:auto}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.mbox h3{margin:0 0 4px;font-size:15px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.empty{color:var(--mut);text-align:center;padding:36px 0}
.note,.err{font-size:13px;color:var(--off);margin:8px 0}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;width:60px;height:60px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:32px;box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:pointer;z-index:20}
.ov{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:su .25s ease}
@keyframes su{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 4px;font-size:20px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.row{display:flex;gap:10px}.row>div{flex:1}
summary{margin-top:14px;color:var(--mut);font-size:14px;cursor:pointer}
.dr{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}.dr.td{color:var(--ink);font-weight:700}
.tr{display:flex;align-items:center;gap:8px;margin-top:8px}.tr b{width:62px;flex:none;font-size:14px}.tr span{flex:1;font-size:12px;color:var(--mut)}.tr input{padding:9px}
.save{width:100%;margin-top:18px;background:var(--pri);color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer}
#login{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#login[hidden]{display:none}#login h2{margin:0;font-size:26px}#login p{margin:0;color:var(--mut)}
#gbtn{background:#fff;color:#222;border:1px solid var(--line);border-radius:14px;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="r1"><div><div class="clk" id="clk"></div><div class="dt" id="today"></div></div><button class="ic" id="menu" aria-label="الإعدادات">⋯</button></div>
<div class="sum"><div><b id="sN">0</b><span>موجودين دلوقتي</span></div><div><b id="sM">0</b><span>اتقابلوا</span></div><div><b id="sT">0</b><span>الإجمالي</span></div></div></div>
<div class="note" id="note" hidden></div>
<input class="srch" id="q" type="search" placeholder="ابحث بالاسم أو التخصص أو المكان">
<div class="areas" id="areas"></div>
<div class="mbox" id="metbox" hidden></div>
<div id="list"></div>
<button class="fab" id="fab" aria-label="إضافة دكتور">+</button>
<div class="ov" id="sheet" hidden><div class="sheet">
  <h2 id="ftitle">دكتور جديد</h2>
  <label>الاسم</label><input id="n" placeholder="د. أحمد" autocomplete="off">
  <label>التخصص</label><input id="s" placeholder="اكتب أو اختار" autocomplete="off"><div class="wrap" id="sps" style="margin-top:8px"></div>
  <label>المنطقة</label><div class="wrap" id="ach"></div>
  <label>المكان (عيادة / مستشفى)</label><input id="p" autocomplete="off">
  <label>أيام التواجد</label><div class="wrap" style="margin-bottom:6px"><button class="chip add" id="pAll">كل الأيام</button><button class="chip add" id="pNF">عدا الجمعة</button></div><div class="wrap" id="days"></div>
  <div id="tms"></div>
  <details><summary>تفاصيل إضافية</summary><label>وصف المكان</label><input id="d" placeholder="الدور التالت، فوق الصيدلية"><label>لينك جوجل ماب</label><input id="m" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/..."></details>
  <div class="err" id="ferr" hidden></div>
  <button class="save" id="save">حفظ</button>
  <button class="b" id="cl1" style="width:100%;margin-top:8px">إلغاء</button>
</div></div>
<div class="ov" id="set" hidden><div class="sheet"><h2>الإعدادات</h2>
  <label>تظبيط الساعة (لو فيه فرق عن موبايلك)</label><div class="btns" style="align-items:center;margin-top:0"><button class="b" id="oM">-</button><b id="oV" style="min-width:28px;text-align:center">0</b><button class="b" id="oP">+</button><span style="color:var(--mut);font-size:13px">ساعة</span></div>
  <label>النسخ الاحتياطي والحساب</label>
  <div class="btns"><button class="b" id="exp">تصدير نسخة احتياطية</button><label class="b" style="margin:0;color:var(--ink);font-size:14px">استيراد<input type="file" id="imp" accept=".json" hidden></label><button class="b del" id="out" style="margin-inline-start:0">تسجيل خروج</button></div>
  <button class="b" id="cl2" style="width:100%;margin-top:16px">إغلاق</button>
</div></div>
<div id="login"><h2>🩺 مواعيد الدكاترة</h2><p id="lmsg">جاري التحميل...</p><button id="gbtn" hidden>الدخول بحساب جوجل</button></div>
<script>
var DN=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],ORDER=[6,0,1,2,3,4,5],SH=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
var SPEC=["باطنة","قلب","عظام","أطفال","نساء وتوليد","جلدية","عيون","أنف وأذن","أسنان","مخ وأعصاب"];
var OFF=0;try{OFF=+localStorage.getItem("clk-off")||0}catch(e){}
function NW(){return new Date(Date.now()+OFF*36e5)}
function showOff(){$("oV").textContent=(OFF>0?"+":"")+OFF}
var S={areas:[],docs:[],specs:[],sel:"all"};
var animNext=true,shown=false,pendDel=null,ref=null,ready=false,sch={},lastT={from:"10:00",to:"14:00"},editId=null,openId=null,fArea="",qs="";
function $(i){return document.getElementById(i)}
function esc(s){var e=document.createElement("div");e.textContent=s==null?"":s;return e.innerHTML.replace(/"/g,"&quot;")}
function mins(s){var p=String(s||"0:0").split(":");return +p[0]*60+ +p[1]}
function metToday(t,n){return !!t&&new Date(t+OFF*36e5).toDateString()===(n||NW()).toDateString()}
function t12(x){var d=new Date(x+OFF*36e5),h=d.getHours(),m=d.getMinutes();return (h%12||12)+":"+(m<10?"0":"")+m+" "+(h<12?"ص":"م")}
function f12(s){var p=String(s||"0:00").split(":"),h=+p[0];return (h%12||12)+":"+p[1]+" "+(h<12?"ص":"م")}
var lastDay=NW().toDateString();
function tick(){var n=NW(),h=n.getHours(),z=function(v){return v<10?"0"+v:v};
$("clk").innerHTML=(h%12||12)+":"+z(n.getMinutes())+"<small>"+z(n.getSeconds())+" "+(h<12?"ص":"م")+"</small>";
var dd=n.toDateString();if(dd!==lastDay){lastDay=dd;render()}}
function sc(d){if(d.sched)return d.sched;var o={};(d.days||[]).forEach(function(i){o[i]={from:d.from,to:d.to}});return o}
function st(d,now){
  var q=sc(d),m=now.getHours()*60+now.getMinutes(),w0=now.getDay(),c=q[w0];
  if(c){var f=mins(c.from),t=mins(c.to);
    if(m>=f&&m<t)return{k:"on",t:"موجود لحد "+f12(c.to),r:0,f:f};
    if(m<f)return{k:"later",t:"يوصل النهارده "+f12(c.from),r:1,f:f}}
  for(var i=1;i<=7;i++){var w=(w0+i)%7,n=q[w];if(n)return{k:"off",t:(c?"خلص. ":"")+"الجاي: "+(i==1?"بكرة":DN[w])+" "+f12(n.from),r:2,f:mins(n.from)}}
  return{k:"off",t:"مفيش أيام",r:3,f:0}
}
function localLoad(){try{var r=localStorage.getItem("docs-v1");if(r)return JSON.parse(r)}catch(e){}return null}
function persist(){
  try{localStorage.setItem("docs-v1",JSON.stringify(S))}catch(e){}
  if(ref){ref.set({areas:S.areas,docs:S.docs,specs:S.specs||[]}).catch(function(){$("note").hidden=false;$("note").textContent="تعذر الحفظ على السيرفر. جرّب تاني."})}
}
function mapLink(d){
  if(d.map&&/^https?:\/\//i.test(d.map))return d.map;
  return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([d.place,d.name,d.area,"الإسكندرية"].filter(Boolean).join(" "));
}
function render(){
  var now=NW(),mt=S.docs.filter(function(d){return metToday(d.metAt,now)}).sort(function(a,b){return b.metAt-a.metAt});
  $("today").textContent=DN[now.getDay()]+" "+now.getDate()+"/"+(now.getMonth()+1);
  $("sT").textContent=S.docs.length;$("sM").textContent=mt.length;
  $("sN").textContent=S.docs.filter(function(d){return st(d,now).k=="on"}).length;
  var h='<button class="chip'+(S.sel=="all"?" sel":"")+'" data-a="all">الكل</button>';
  S.areas.forEach(function(a){h+='<button class="chip'+(S.sel==a?" sel":"")+'" data-a="'+esc(a)+'">'+esc(a)+'</button>'});
  if(S.docs.some(function(d){return !d.area}))h+='<button class="chip'+(S.sel=="none"?" sel":"")+'" data-a="none">بدون منطقة</button>';
  $("areas").innerHTML=h+'<button class="chip add" id="addA">+ منطقة</button>';
  var mb=$("metbox");
  if(mt.length){mb.hidden=false;mb.innerHTML="<h3>✅ اتقابلوا النهارده</h3>"+mt.map(function(d){return '<div class="mrow"><div><b>'+esc(d.name)+'</b><small>'+esc(d.place||d.area||d.spec||"")+' - '+t12(d.metAt)+'</small></div><button class="b" data-m="'+esc(d.id)+'">تراجع</button></div>'}).join("")}else{mb.hidden=true;mb.innerHTML=""}
  if(!ready){$("list").innerHTML='<div class="empty">جاري التحميل...</div>';return}
  var q=qs.trim().toLowerCase();
  var list=S.docs.filter(function(d){
    if(!(S.sel=="all"||(S.sel=="none"?!d.area:d.area==S.sel)))return false;
    return !q||[d.name,d.spec,d.place,d.area,d.desc].join(" ").toLowerCase().indexOf(q)>=0;
  }).map(function(d){return{d:d,s:st(d,now)}}).sort(function(a,b){return a.s.r-b.s.r||a.s.f-b.s.f});
  if(!list.length){$("list").innerHTML='<div class="empty">'+(S.docs.length?"مفيش نتائج":"ضيف أول دكتور بزر +")+'</div>';return}
  $("list").innerHTML=list.map(function(o){
    var d=o.d,s=o.s,id=esc(d.id),met=metToday(d.metAt,now),op=openId===d.id,x="";
    if(op){x=(d.desc?'<div class="pl">'+esc(d.desc)+'</div>':"")+'<div class="dl">'+ORDER.filter(function(i){return sc(d)[i]}).map(function(i){var c=sc(d)[i];return '<div class="dr'+(i==now.getDay()?" td":"")+'"><span>'+DN[i]+'</span><span>'+f12(c.from)+' - '+f12(c.to)+'</span></div>'}).join("")+'</div><div class="btns"><a class="b p" target="_blank" rel="noopener" href="'+esc(mapLink(d))+'">الموقع</a><button class="b" data-e="'+id+'">تعديل</button><button class="b del" data-x="'+id+'">'+(pendDel===d.id?"تأكيد الحذف؟":"حذف")+'</button></div>'}
    return '<div class="cd '+s.k+(met?" met":"")+'"><button class="ck" data-m="'+id+'" aria-label="اتقابل">'+(met?"✓":"")+'</button><div class="bd" data-o="'+id+'"><div class="nm">'+esc(d.name)+(d.spec?'<span class="sp">'+esc(d.spec)+'</span>':"")+'</div><div class="pl">'+esc(d.place||"")+(d.place&&d.area?" - ":"")+esc(d.area||"")+'</div><div class="stt"><i></i>'+esc(s.t)+(met?" - اتقابل "+t12(d.metAt):"")+'</div>'+x+'</div></div>'
  }).join("");
  animNext=false;
}
function drawForm(){
  $("ach").innerHTML='<button class="chip'+(fArea===""?" sel":"")+'" data-ar="">بدون</button>'+S.areas.map(function(a){return '<button class="chip'+(fArea===a?" sel":"")+'" data-ar="'+esc(a)+'">'+esc(a)+'</button>'}).join("")+'<button class="chip add" id="addF">+ جديدة</button>';
  var u=(S.specs||[]).slice();S.docs.forEach(function(d){if(d.spec&&u.indexOf(d.spec)<0)u.push(d.spec)});
  $("sps").innerHTML=u.concat(SPEC.filter(function(x){return u.indexOf(x)<0})).map(function(x){return '<button class="chip" data-sp="'+esc(x)+'">'+esc(x)+'</button>'}).join("");
  drawT();
  $("days").innerHTML=ORDER.map(function(i){return '<button class="chip'+(sch[i]?" sel":"")+'" data-d="'+i+'">'+SH[i]+'</button>'}).join("");
}
function drawT(){var ks=ORDER.filter(function(i){return sch[i]});
  $("tms").innerHTML=(ks.length?'<div class="tr"><b></b><span>من</span><span>إلى</span></div>':"")+ks.map(function(i){return '<div class="tr"><b>'+DN[i]+'</b><input type="time" data-tf="'+i+'" value="'+sch[i].from+'"><input type="time" data-tt="'+i+'" value="'+sch[i].to+'"></div>'}).join("")+(ks.length>1?'<button class="chip add" id="cpT" style="margin-top:10px">نفس وقت '+DN[ks[0]]+' لكل الأيام</button>':"")}
function setDays(a){var o={};a.forEach(function(i){o[i]=sch[i]||{from:lastT.from,to:lastT.to}});sch=o;drawForm()}
$("tms").oninput=function(e){var T=e.target,f=T.getAttribute("data-tf"),t=T.getAttribute("data-tt"),k=f!==null?f:t;if(k===null)return;if(f!==null)sch[k].from=T.value;else sch[k].to=T.value;lastT={from:sch[k].from,to:sch[k].to}};
function openForm(id){
  editId=null;$("ferr").hidden=true;
  ["n","s","p","d","m"].forEach(function(i){$(i).value=""});sch={};fArea=S.areas.indexOf(S.sel)>=0?S.sel:"";
  $("ftitle").textContent="دكتور جديد";
  S.docs.forEach(function(d){if(d.id==id){editId=d.id;$("n").value=d.name;$("s").value=d.spec||"";$("p").value=d.place||"";$("d").value=d.desc||"";$("m").value=d.map||"";sch=JSON.parse(JSON.stringify(sc(d)));fArea=d.area||"";$("ftitle").textContent="تعديل دكتور"}});
  drawForm();$("sheet").hidden=false;if(!editId)setTimeout(function(){$("n").focus()},300);
}
function addArea(inForm){
  var n=(prompt("اسم المنطقة")||"").trim();if(!n)return;
  if(S.areas.indexOf(n)<0)S.areas.push(n);
  if(inForm)fArea=n;else S.sel=n;
  persist();render();if(inForm)drawForm();
}
document.addEventListener("click",function(e){
  var T=e.target,i=T.id,g=function(k){var n=T.closest("["+k+"]");return n?n.getAttribute(k):null};
  var m=g("data-m"),x=g("data-x"),ed=g("data-e"),ds=g("data-d"),sp=g("data-sp"),ar=g("data-ar"),a=g("data-a"),o=g("data-o");
  if(m!==null){S.docs.forEach(function(d){if(d.id==m)d.metAt=metToday(d.metAt)?null:Date.now()});persist();render();return}
  if(x!==null){if(pendDel===x){S.docs=S.docs.filter(function(d){return d.id!=x});pendDel=null;persist();render()}else{pendDel=x;render();setTimeout(function(){if(pendDel===x){pendDel=null;render()}},4000)}return}
  if(ed!==null){openForm(ed);return}
  if(ds!==null){ds=+ds;if(sch[ds])delete sch[ds];else sch[ds]={from:lastT.from,to:lastT.to};drawForm();return}
  if(sp!==null){$("s").value=sp;return}
  if(ar!==null){fArea=ar;drawForm();return}
  if(a!==null){S.sel=a;render();return}
  if(o!==null){openId=openId===o?null:o;render();return}
  if(i=="pAll")setDays([0,1,2,3,4,5,6]);
  else if(i=="pNF")setDays([6,0,1,2,3,4]);
  else if(i=="cpT"){var ks=ORDER.filter(function(k){return sch[k]}),c=sch[ks[0]];ks.forEach(function(k){sch[k]={from:c.from,to:c.to}});drawForm()}
  else if(i=="addA")addArea(false);
  else if(i=="addF")addArea(true);
  else if(i=="fab")openForm();
  else if(i=="menu"){showOff();$("set").hidden=false}
  else if(i=="oM"||i=="oP"){OFF+=i=="oP"?1:-1;try{localStorage.setItem("clk-off",OFF)}catch(e){}showOff();tick();render()}
  else if(i=="cl1"||i=="sheet")$("sheet").hidden=true;
  else if(i=="cl2"||i=="set")$("set").hidden=true;
});
$("q").oninput=function(){qs=this.value;render()};
$("save").onclick=function(){
  var n=$("n").value.trim(),er=$("ferr"),ks=ORDER.filter(function(i){return sch[i]});
  function bad(t){er.hidden=false;er.textContent=t}
  if(!n)return bad("اكتب اسم الدكتور");
  if(!ks.length)return bad("اختار يوم واحد على الأقل");
  for(var j=0;j<ks.length;j++){var c=sch[ks[j]];if(!c.from||!c.to||mins(c.to)<=mins(c.from))return bad("ظبط وقت يوم "+DN[ks[j]])}
  var rec={id:editId||String(Date.now()),name:n,spec:$("s").value.trim(),place:$("p").value.trim(),area:fArea,desc:$("d").value.trim(),map:$("m").value.trim(),sched:JSON.parse(JSON.stringify(sch)),days:ks,from:sch[ks[0]].from,to:sch[ks[0]].to,metAt:null};
  if(editId){S.docs=S.docs.map(function(d){if(d.id==editId){rec.metAt=d.metAt||null;return rec}return d})}else S.docs.push(rec);
  var sp=rec.spec;if(sp){S.specs=S.specs||[];if(S.specs.indexOf(sp)<0&&SPEC.indexOf(sp)<0)S.specs.push(sp)}
  editId=null;$("sheet").hidden=true;persist();render();
};
$("exp").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({areas:S.areas,docs:S.docs,specs:S.specs||[]})],{type:"application/json"}));a.download="doctors-backup.json";a.click()};
$("imp").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!Array.isArray(o.areas)||!Array.isArray(o.docs))throw 0;S.areas=o.areas;S.docs=o.docs;S.specs=o.specs||S.specs||[];persist();$("set").hidden=true;render()}catch(e){$("note").hidden=false;$("note").textContent="الملف مش صالح"}};r.readAsText(f)};
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
setInterval(render,30000);tick();setInterval(tick,1000);
(function(){var l=localLoad();if(l){S.areas=l.areas||[];S.docs=l.docs||[];S.specs=l.specs||[]}ready=true;render()})();
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDYO099MaamEipHKQadGzzRr4T_-7EBcyw",authDomain:"doctors-9038e.firebaseapp.com",projectId:"doctors-9038e",storageBucket:"doctors-9038e.firebasestorage.app",messagingSenderId:"1091747320167",appId:"1:1091747320167:web:007dcaae7bca5bacb55fc2"};
const app=initializeApp(cfg),auth=getAuth(app),fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const el=i=>document.getElementById(i);
let unsub=null;
el("gbtn").onclick=async()=>{
  const p=new GoogleAuthProvider();
  try{await signInWithPopup(auth,p)}
  catch(e){
    if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){signInWithRedirect(auth,p)}
    else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request"){el("lmsg").textContent="تعذر الدخول: "+(e.code||e.message)}
  }
};
el("out").onclick=async()=>{
  await signOut(auth);
  window.S.areas=[];window.S.docs=[];window.S.specs=[];
  try{localStorage.removeItem("docs-v1")}catch(e){}
  window.render();
};
onAuthStateChanged(auth,u=>{
  if(unsub){unsub();unsub=null}
  if(!u){
    window.ref=null;
    el("login").hidden=false;el("lmsg").textContent="سجّل دخولك عشان بياناتك تظهر على كل أجهزتك";el("gbtn").hidden=false;
    return;
  }
  el("login").hidden=true;
  const d=doc(fs,"users",u.uid);
  window.ref={set:o=>setDoc(d,o)};
  let first=true;
  unsub=onSnapshot(d,snap=>{
    if(snap.exists()){const c=snap.data();window.S.areas=c.areas||[];window.S.docs=c.docs||[];window.S.specs=c.specs||[]}
    else if(first){const l=window.localLoad();if(l&&(l.docs||[]).length){window.S.areas=l.areas||[];window.S.docs=l.docs||[];window.S.specs=l.specs||[];window.persist()}}
    first=false;window.ready=true;
    if(!window.shown){window.animNext=true;window.shown=true}
    window.render();
  },e=>{const n=el("note");n.hidden=false;n.textContent="تعذر قراءة البيانات: "+(e.code||e.message)});
});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
