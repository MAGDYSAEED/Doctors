<script>try{var _t=localStorage.getItem("theme");if(_t)document.documentElement.setAttribute("data-theme",_t)}catch(e){}</script>

<style>
:root{--bg:#eef0f5;--card:#fff;--card2:#f4f5fa;--ink:#0b1220;--mut:#6b7280;--line:#e3e6ee;--pri:#4f5bff;--on:#10b981;--amb:#f59e0b;--off:#ef4444;--spl:36%;--sh:0 1px 2px rgba(10,16,32,.05),0 10px 28px -14px rgba(10,16,32,.22);--glass:rgba(255,255,255,.8);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06080f;--card:#0f1524;--card2:#151d31;--ink:#eef2fa;--mut:#8b97ad;--line:#1d2742;--pri:#7280ff;--on:#34d399;--amb:#fbbf24;--off:#f87171;--spl:70%;--sh:0 1px 0 rgba(255,255,255,.04) inset,0 14px 32px -16px rgba(0,0,0,.8);--glass:rgba(12,18,32,.8);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06080f;--card:#0f1524;--card2:#151d31;--ink:#eef2fa;--mut:#8b97ad;--line:#1d2742;--pri:#7280ff;--on:#34d399;--amb:#fbbf24;--off:#f87171;--spl:70%;--sh:0 1px 0 rgba(255,255,255,.04) inset,0 14px 32px -16px rgba(0,0,0,.8);--glass:rgba(12,18,32,.8);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:radial-gradient(900px 420px at 50% -120px,color-mix(in srgb,var(--pri) 16%,transparent),transparent 70%),var(--bg);min-height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;max-width:620px;margin-inline:auto;padding:12px 14px 170px}
button{font:inherit;color:inherit}
svg{display:block}
.top{position:relative;overflow:hidden;background:linear-gradient(150deg,#0a1026 0%,#17224a 58%,#27358a 120%);color:#fff;border-radius:28px;padding:20px 20px 16px;border:1px solid rgba(255,255,255,.08);box-shadow:0 22px 44px -22px rgba(23,34,74,.9)}
.top::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;inset-block-start:-110px;inset-inline-end:-70px;background:radial-gradient(circle,rgba(124,140,255,.45),transparent 70%);pointer-events:none}
.r1{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start}
.clk{font-size:52px;font-weight:600;line-height:1;direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:-1.5px}
.clk small{font-size:16px;font-weight:500;opacity:.6;margin-inline-start:8px;letter-spacing:0}
.dt{opacity:.7;margin-top:8px;font-size:14.5px;font-weight:500}
.ic{display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;width:42px;height:42px;border-radius:14px;cursor:pointer}
.sum{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.sum div+div{border-inline-start:1px solid rgba(255,255,255,.12);padding-inline-start:16px}
.sum b{display:block;font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.sum span{font-size:12.5px;opacity:.7;font-weight:500}
.s1 b{color:#4ade80}.s2 b{color:#fbbf24}.s2{cursor:pointer}.s2 span::after{content:" ›"}
.srch{width:100%;margin:16px 0 6px;height:50px;font:inherit;padding:0 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.srch:focus,input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
.areas,.fl{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.areas::-webkit-scrollbar,.fl::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s}
.chip.sel{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700;box-shadow:0 8px 18px -8px var(--pri)}
.chip.add{border-style:dashed;color:var(--mut);background:transparent}
.cd{position:relative;overflow:hidden;display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 16px 15px 14px;margin:11px 0;box-shadow:var(--sh)}
.cd::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--line)}
.cd.on::before{background:var(--on)}.cd.later::before{background:var(--amb)}.cd.away::before{background:var(--off)}.cd.off::before{background:color-mix(in srgb,var(--mut) 45%,transparent)}
.cd.an{animation:in .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.ck{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card2);color:#fff;cursor:pointer;transition:.15s}
.met .ck{background:linear-gradient(135deg,#fbbf24,#f59e0b);border-color:transparent;box-shadow:0 8px 18px -8px rgba(245,158,11,.9)}
.cd.pop .ck{animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
.bd{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:700;font-size:17px;letter-spacing:-.2px}
.sp{margin-inline-start:8px;font-size:11.5px;font-weight:700;color:hsl(var(--h,220) 70% var(--spl));background:hsl(var(--h,220) 70% 50%/.12);border:1px solid hsl(var(--h,220) 70% 50%/.3);border-radius:999px;padding:2px 10px;white-space:nowrap}
.pl{color:var(--mut);font-size:13.5px;margin-top:4px}
.stt{width:fit-content;margin-top:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--mut);background:var(--card2);padding:5px 12px 5px 11px;border-radius:999px}
.stt i{width:8px;height:8px;border-radius:50%;background:var(--mut);opacity:.5;flex:none}
.on .stt{color:var(--on);background:color-mix(in srgb,var(--on) 13%,transparent)}.on .stt i{background:var(--on);opacity:1;animation:pl 1.8s infinite}
.later .stt{color:var(--amb);background:color-mix(in srgb,var(--amb) 14%,transparent)}.later .stt i{background:var(--amb);opacity:1}
.away .stt{color:var(--off);background:color-mix(in srgb,var(--off) 12%,transparent)}.away .stt i{background:var(--off);opacity:1}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.dys{display:flex;gap:4px;margin-top:10px}
.dy{width:23px;height:23px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;border-radius:8px;background:var(--card2);color:var(--mut);opacity:.5}
.dy.a{opacity:1;background:color-mix(in srgb,var(--pri) 15%,transparent);color:var(--pri)}
.dy.t{background:var(--pri);color:#fff;box-shadow:0 6px 12px -6px var(--pri)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.b{border:1px solid var(--line);background:var(--card2);border-radius:13px;padding:10px 16px;min-height:42px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.b.p{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 8px 18px -8px var(--pri)}
.b.del{color:var(--off);margin-inline-start:auto}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.empty{color:var(--mut);text-align:center;padding:40px 0}
.note,.err{font-size:13px;color:var(--off);margin:8px 0}
.fab{position:fixed;bottom:calc(98px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;display:grid;place-items:center;width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 60%,#8b5cf6));color:#fff;box-shadow:0 16px 30px -10px var(--pri);cursor:pointer;z-index:20}
.nav{position:fixed;inset-inline:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:min(596px,calc(100% - 24px));display:flex;gap:2px;padding:7px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line);box-shadow:0 20px 44px -16px rgba(0,0,0,.45);z-index:30}
.nv{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;border:0;background:transparent;border-radius:19px;color:var(--mut);font-size:11px;font-weight:500;cursor:pointer;transition:.15s}
.nv svg{width:22px;height:22px}
.nv.sel{color:var(--pri);background:color-mix(in srgb,var(--pri) 13%,transparent);font-weight:700}
.bdg{position:absolute;top:3px;inset-inline-end:calc(50% - 25px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--on);color:#04130d;font-size:10px;font-weight:700;line-height:17px;font-style:normal;text-align:center}
.bdg.m{background:var(--amb)}.bdg[hidden]{display:none}
.ov{position:fixed;inset:0;background:rgba(5,9,20,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{position:relative;background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;border:1px solid var(--line);padding:26px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:su .28s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";position:absolute;top:9px;left:50%;width:42px;height:4px;margin-left:-21px;border-radius:2px;background:var(--line)}
@keyframes su{from{transform:translateY(50px);opacity:0}}
.sheet h2{margin:0 0 6px;font-size:20px;letter-spacing:-.3px}
label{display:block;font-size:13px;color:var(--mut);font-weight:500;margin:16px 0 7px}
input{width:100%;font:inherit;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--card2);color:var(--ink)}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
summary{margin-top:16px;color:var(--mut);font-size:14px;cursor:pointer}
.dr{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}.dr.td{color:var(--ink);font-weight:700}
.tr{display:flex;align-items:center;gap:8px;margin-top:8px}.tr b{width:62px;flex:none;font-size:14px}.tr span{flex:1;font-size:12px;color:var(--mut)}.tr input{height:42px;padding:0 10px}
.ago{font-size:12px;color:var(--mut);margin-top:7px}.ago.l{color:var(--off)}.star{color:var(--amb);margin-inline-start:5px}
.vh{margin-top:10px;font-size:13px;color:var(--mut)}.vh div{padding:5px 0;border-top:1px solid var(--line)}.vn{margin-top:10px;height:42px;padding:0 10px}
.save{width:100%;margin-top:20px;height:52px;background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 60%,#8b5cf6));color:#fff;border:0;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 14px 26px -12px var(--pri)}
#login{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#login[hidden]{display:none}#login h2{margin:0;font-size:26px;letter-spacing:-.4px}#login p{margin:0;color:var(--mut)}
.lg{display:grid;place-items:center;width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,#17224a,#27358a);color:#fff;box-shadow:0 20px 36px -16px #27358a}
#gbtn{background:#fff;color:#222;border:1px solid var(--line);border-radius:16px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:var(--sh)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
var DN=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],ORDER=[6,0,1,2,3,4,5],SH=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
var SPEC=["باطنة","قلب","عظام","أطفال","نساء وتوليد","جلدية","عيون","أنف وأذن","أسنان","مخ وأعصاب"];

function NW(){return new Date(Date.now()+OFF*36e5)}
function showOff(){$("oV").textContent=(OFF>0?"+":"")+OFF}

var UP=null,fLoc=null,popId=null,animNext=true,shown=false,pendDel=null,ref=null,ready=false,sch={},lastT={from:"10:00",to:"14:00"},editId=null,openId=null,fArea="",qs="",fStar=false;
function $(i){return document.getElementById(i)}
function esc(s){var e=document.createElement("div");e.textContent=s==null?"":s;return e.innerHTML.replace(/"/g,"&quot;")}
function mins(s){var p=String(s||"0:0").split(":");return +p[0]*60+ +p[1]}
function metToday(t,n){return !!t&&new Date(t+OFF*36e5).toDateString()===(n||NW()).toDateString()}
function t12(x){var d=new Date(x+OFF*36e5),h=d.getHours(),m=d.getMinutes();return (h%12||12)+":"+(m<10?"0":"")+m+" "+(h<12?"ص":"م")}
function f12(s){var p=String(s||"0:00").split(":"),h=+p[0];return (h%12||12)+":"+p[1]+" "+(h<12?"ص":"م")}

  if(!ks.length)return bad("اختار يوم واحد على الأقل");
  for(var j=0;j<ks.length;j++){var c=sch[ks[j]];if(!c.from||!c.to||mins(c.to)<=mins(c.from))return bad("ظبط وقت يوم "+DN[ks[j]])}
  var rec={id:editId||String(Date.now()),name:n,spec:$("s").value.trim(),place:$("p").value.trim(),area:fArea,desc:$("d").value.trim(),map:$("m").value.trim(),sched:JSON.parse(JSON.stringify(sch)),days:ks,from:sch[ks[0]].from,to:sch[ks[0]].to,phone:$("ph").value.trim(),note:$("nt").value.trim(),star:fStar,lat:fLoc?fLoc.lat:null,lng:fLoc?fLoc.lng:null,visits:[],away:null,metAt:null};
  if(editId){S.docs=S.docs.map(function(d){if(d.id==editId){rec.metAt=d.metAt||null;rec.visits=d.visits||[];rec.away=d.away||null;return rec}return d})}else S.docs.push(rec);
  var sp=rec.spec;if(sp){S.specs=S.specs||[];if(S.specs.indexOf(sp)<0&&SPEC.indexOf(sp)<0)S.specs.push(sp)}
  editId=null;$("sheet").hidden=true;persist();render();
};
$("exp").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({areas:S.areas,docs:S.docs,specs:S.specs||[]})],{type:"application/json"}));a.download="doctors-backup.json";a.click()};
$("imp").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!Array.isArray(o.areas)||!Array.isArray(o.docs))throw 0;S.areas=o.areas;S.docs=o.docs;S.specs=o.specs||S.specs||[];persist();$("set").hidden=true;render()}catch(e){$("note").hidden=false;$("note").textContent="الملف مش صالح"}};r.readAsText(f)};
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
setInterval(render,30000);tick();setInterval(tick,1000);
(function(){var l=localLoad();if(l){S.areas=l.areas||[];S.docs=l.docs||[];S.specs=l.specs||[]}ready=true;render()})();

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDYO099MaamEipHKQadGzzRr4T_-7EBcyw",authDomain:"doctors-9038e.firebaseapp.com",projectId:"doctors-9038e",storageBucket:"doctors-9038e.firebasestorage.app",messagingSenderId:"1091747320167",appId:"1:1091747320167:web:007dcaae7bca5bacb55fc2"};
const app=initializeApp(cfg),auth=getAuth(app),fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const el=i=>document.getElementById(i);
let unsub=null;
el("gbtn").onclick=async()=>{
  const p=new GoogleAuthProvider();
  try{await signInWithPopup(auth,p)}
  catch(e){
    if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){signInWithRedirect(auth,p)}
    else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request"){el("lmsg").textContent="تعذر الدخول: "+(e.code||e.message)}
  }
};
el("out").onclick=async()=>{
  await signOut(auth);
  window.S.areas=[];window.S.docs=[];window.S.specs=[];
  try{localStorage.removeItem("docs-v1")}catch(e){}
  window.render();
};
onAuthStateChanged(auth,u=>{
  if(unsub){unsub();unsub=null}
  if(!u){
    window.ref=null;
    el("login").hidden=false;el("lmsg").textContent="سجّل دخولك عشان بياناتك تظهر على كل أجهزتك";el("gbtn").hidden=false;
    return;
  }
  el("login").hidden=true;
  const d=doc(fs,"users",u.uid);
  window.ref={set:o=>setDoc(d,o)};
  let first=true;
  unsub=onSnapshot(d,snap=>{
    if(snap.exists()){const c=snap.data();window.S.areas=c.areas||[];window.S.docs=c.docs||[];window.S.specs=c.specs||[]}
    else if(first){const l=window.localLoad();if(l&&(l.docs||[]).length){window.S.areas=l.areas||[];window.S.docs=l.docs||[];window.S.specs=l.specs||[];window.persist()}}
    first=false;window.ready=true;
    if(!window.shown){window.animNext=true;window.shown=true}
    window.render();
  },e=>{const n=el("note");n.hidden=false;n.textContent="تعذر قراءة البيانات: "+(e.code||e.message)});
});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
